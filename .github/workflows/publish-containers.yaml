name: Publish Workshop Containers

on:
  push:
    branches:
      - main
      - 'refactor/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: prompt-extraction-service
          - name: prompt-extraction-user
          - name: email-indirect-service
          - name: email-indirect-user
          - name: rag-poisoning-service
          - name: rag-poisoning-user
          - name: yolo-l2-verification
          - name: yolo-l2-notebook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container via Nix
        run: nix run .#build-${{ matrix.image.name }} -- --push
