services:
  # Equivalent to: rag-poisoning-user (Pod/Service)
  rag-poisoning-user:
    build:
      context: ./user
    image: workshop-rag-poisoning-user:local
    ports:
      - "30070:5000"
    environment:
      - SERVICE_URL=http://rag-poisoning-service:5000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  rag-poisoning-service:
    build:
      context: ..
      dockerfile: rag-poisoning/service/Dockerfile
    image: workshop-rag-poisoning-service:local
    environment:
      - VLLM_URL=${VLLM_URL:-http://llm-services.local/v1/chat/completions}
      - VLLM_MODEL=${VLLM_MODEL:-vllm-model}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M