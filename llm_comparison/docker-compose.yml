services:
  # Equivalent to: llm-comparison-user (Pod/Service)
  llm-comparison-user:
    build:
      context: .
    image: workshop-llm-comparison-user:local
    ports:
      - "30080:5000"
    environment:
      - SERVICE_URL=http://llm-comparison-service:5000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Equivalent to: llm-comparison-service (Deployment/Service)
  llm-comparison-service:
    build:
      context: ./service
    image: workshop-llm-comparison-service:local
    environment:
      - VLLM_URL=${VLLM_URL:-http://llm-services.local/v1/chat/completions}
      - VLLM_MODEL=${VLLM_MODEL:-vllm-model}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
